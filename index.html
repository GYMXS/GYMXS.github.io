<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libreta de notas</title>
<script>
  /* Aplica el tema guardado (o el del sistema) antes de dibujar la página, para evitar un parpadeo */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('libreta-tema'); } catch (e) {}
    var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="app">
  <aside>
    <div class="top">
      <div class="brand">Libreta de notas</div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar tema"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
    <div id="side"></div>
    <div class="foot">
      <button class="link" data-act="backup">Copia de seguridad</button>
      <button class="link" data-act="restore">Restaurar</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgHint"></p>
    <textarea id="dlgInput" class="field" rows="1"></textarea>
    <div class="acts">
      <button class="btn primary" value="ok">Guardar</button>
      <button class="btn" value="cancel" formnovalidate>Cancelar</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=3"></script>
</body>
</html>
